name: Go test windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  ACCEPT_EULA: Y
  MSSQL_PID: Developer
  MSSQL_SA_PASSWORD: Passw0rd
  MYSQL_DATABASE: G2
  MYSQL_PASSWORD: mysql
  MYSQL_ROOT_PASSWORD: root
  MYSQL_USER: mysql
  POSTGRESQL_DATABASE: G2
  POSTGRESQL_PASSWORD: senzing
  POSTGRESQL_POSTGRES_PASSWORD: postgres
  POSTGRESQL_USERNAME: senzing
  SENZING_TOOLS_DATABASE_URL: 'sqlite3://na:na@nowhere/C:\Temp\sqlite\G2C.db'

permissions: {}

jobs:
  go-test-windows:
    name: "Go test with OS: windows-latest; Go: ${{ matrix.go }}"
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.27"]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup go ${{ matrix.go }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Set up gotestfmt
        uses: gotesttools/gotestfmt-action@eba2ac97f623e866e7b1b117c99f18b43cd36d18 # v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # - name: Install Docker
      #   uses: docker-practice/actions-setup-docker@v1
      #   timeout-minutes: 12

      - name: Install Docker
        uses: crazy-max/ghaction-setup-docker@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0

      - name: Install PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: senzing
          password: senzing
          database: G2
          port: 5432
        id: postgres

      # - name: PostgreSQL service
      #   run: docker run --detach --env POSTGRESQL_DATABASE --env POSTGRESQL_PASSWORD --env POSTGRESQL_POSTGRES_PASSWORD --env POSTGRESQL_USERNAME --publish 5432:5432 postgresql:latest

      # - name: MsSQL service
      #   run: docker run --detach --env ACCEPT_EULA --env MSSQL_PID --env MSSQL_SA_PASSWORD --publish 1433:1433 mcr.microsoft.com/mssql/server

      # - name: MySQL service
      #   run: docker run --detach --env MYSQL_DATABASE --env MYSQL_PASSWORD --env MYSQL_ROOT_PASSWORD --env MYSQL_USER --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=6 --publish 3306:3306 mysql

      - name: create empty Sqlite database file
        run: |
          mkdir "C:\Temp\sqlite"
          New-Item "C:\Temp\sqlite\G2C.db"

      # - name: run go test
      #   run: go test -v -p 1 ./...

      # - name: run go test - main
      #   run: go test -v -p 1 ./.

      - name: run go test - connector
        run: |
          go test -v -p 1 ./connector

      - name: run go test - connectordb2
        run: |
          go test -v -p 1 ./connectordb2

      # - name: run go test - connectormssql
      #   run: go test -v -p 1 ./connectormssql

      - name: Run go test - connectormysql
        run: |
          go test -v -p 1 ./connectormysql

      - name: Run go test - connectorpostgresql
        run: |
          go test -v -p 1 ./connectorpostgresql

      - name: Run go test - connectorsqlite
        run: |
          go test -v -p 1 ./connectorsqlite

      - name: Run go test - dbhelper
        run: |
          go test -v -p 1 ./dbhelper

      - name: Run go test - postgresql
        run: |
          go test -v -p 1 ./postgresql

      - name: Run go test - sqlexecutor
        run: |
          go test -v -p 1 ./sqlexecutor

      - name: Run go test - main
        run: |
          go test -v -p 1 ./.

      - name: Run go test
        run: |
          go test -json -v -p 1 -coverprofile=cover -covermode=atomic -coverpkg=./... ./... 2>&1 | tee "C:\Temp\gotest.log" | gotestfmt
          cp cover cover.out

      - name: Store coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cover.out
          path: cover.out

      - name: Upload test log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-log
          path: "C:\\Temp\\gotest.log"
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: go-test-windows
    permissions:
      contents: read
    uses: senzing-factory/build-resources/.github/workflows/go-coverage.yaml@v4
    with:
      coverage-config: ./.github/coverage/testcoverage.yaml
