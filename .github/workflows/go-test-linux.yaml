name: Go test linux

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  LD_LIBRARY_PATH: /opt/senzing/er/lib:/opt/oracle/instantclient_23_5
  SENZING_TOOLS_DATABASE_URL: sqlite3://na:na@nowhere/tmp/sqlite/G2C.db

permissions: {}

jobs:
  go-test-linux:
    name: "Go test with OS: ${{ matrix.os }}; Go: ${{ matrix.go }}"
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
        os: [ubuntu-latest]
    timeout-minutes: 30

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Set up gotestfmt
        uses: gotesttools/gotestfmt-action@v2.3.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Oracle service
        run: |
          docker run --detach \
            --env ORACLE_PWD=Passw0rd \
            --publish 1521:1521 \
            container-registry.oracle.com/database/free:23.9.0.0

      - name: MsSQL service
        run: |
          docker run --detach \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD=Passw0rd \
            --publish 1433:1433 \
            mcr.microsoft.com/mssql/server:2025-latest

      - name: MySQL service
        run: |
          docker run --detach \
            --env MYSQL_DATABASE=G2 \
            --env MYSQL_PASSWORD=mysql \
            --env MYSQL_ROOT_PASSWORD=root \
            --env MYSQL_USER=mysql \
            --health-cmd="mysqladmin ping" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            --publish 3306:3306 \
            mysql:9.4.0

      - name: PostgreSQL service
        run: |
          docker run --detach \
            --env POSTGRES_DB=G2 \
            --env POSTGRES_PASSWORD=postgres \
            --health-cmd=pg_isready \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=5 \
            --publish 5432:5432 \
            postgres:18

      - name: Make empty G2C.db
        run: |
          mkdir /tmp/sqlite
          touch /tmp/sqlite/G2C.db

      - name: Install Oracle SDK
        run: |
          curl --output /tmp/instantclient-basic-linux.zip https://download.oracle.com/otn_software/linux/instantclient/2350000/instantclient-basic-linux.x64-23.5.0.24.07.zip
          sudo mkdir -p /opt/oracle
          sudo unzip -d /opt/oracle /tmp/instantclient-basic-linux.zip
          sudo apt-get install libaio1t64 libaio-dev
          sudo ln -s /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/libaio.so.1

      - name: Run go test
        run: |
          go test -json -v -p 1 -coverprofile=./cover.out -covermode=atomic -coverpkg=./... ./...  2>&1 | tee /tmp/gotest.log | gotestfmt

      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: cover.out
          path: ./cover.out

      - name: Upload test log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-log
          path: /tmp/gotest.log
          if-no-files-found: error

      - name: Notify Slack on failure
        if: (failure() || cancelled()) && github.ref_name == github.event.repository.default_branch
        uses: senzing-factory/build-resources/slack-failure-notification@v4
        with:
          job-status: ${{ job.status }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}

  coverage:
    name: Coverage
    needs: go-test-linux
    permissions:
      contents: read
    uses: senzing-factory/build-resources/.github/workflows/go-coverage.yaml@v4
    with:
      coverage-config: ./.github/coverage/testcoverage.yaml
